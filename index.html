<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEPSE Terminal - Live Nepal Stock Market Intelligence</title>
    <meta name="description" content="Real-time NEPSE stock market terminal, live price updates, technical indicators, portfolio tracker, fundamentals, and share structure analysis.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Supabase JS Client library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase_client.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="brand-logo">
                <div class="logo-icon">N</div>
                <span>NEPSE Terminal</span>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-item active" data-view="dashboard">
                    <span class="nav-icon">📊</span>
                    <span>Dashboard</span>
                </div>
                <div class="nav-item" data-view="stocks">
                    <span class="nav-icon">📈</span>
                    <span>Stock Market</span>
                </div>
                <div class="nav-item" data-view="portfolio">
                    <span class="nav-icon">💼</span>
                    <span>Portfolio</span>
                </div>
                <div class="nav-item" data-view="watchlist">
                    <span class="nav-icon">⭐</span>
                    <span>Watchlist</span>
                </div>
                <div class="nav-item" data-view="analytics">
                    <span class="nav-icon">🔥</span>
                    <span>Sector Heatmap</span>
                </div>
            </nav>

            <div class="sidebar-footer" style="padding-top: 1rem; border-top: 1px solid var(--border-color);">
                <small class="text-muted" id="tradeDate">Connecting...</small>
            </div>
        </aside>

        <!-- Main Workspace Area -->
        <div class="main-wrapper">
            <!-- Top Navbar Header -->
            <header class="top-navbar">
                <div class="nav-status-pill">
                    <span class="status-dot"></span>
                    <span id="lastUpdatedTime">Live Real-Time Feed</span>
                </div>

                <div class="user-profile-bar">
                    <span id="navUserLabel" class="text-muted">Guest User</span>
                    <button id="navAuthBtn" class="btn btn-primary btn-sm">Sign In</button>
                </div>
            </header>

            <!-- Active View Containers -->
            <main class="content-area">
                <section id="view-dashboard" class="view-section active"></section>
                <section id="view-stocks" class="view-section"></section>
                <section id="view-portfolio" class="view-section"></section>
                <section id="view-watchlist" class="view-section"></section>
                <section id="view-analytics" class="view-section"></section>
            </main>
        </div>
    </div>

    <!-- Stock Detail Modal Container -->
    <div id="modal-stock-detail" class="modal-overlay">
        <div class="modal-content"></div>
    </div>

    <!-- Auth / Sign In Modal Container -->
    <div id="modal-auth" class="modal-overlay">
        <div class="modal-content" style="max-width: 420px;">
            <div class="modal-header">
                <h3 class="modal-title">Sign In / Register</h3>
                <button class="btn-close" id="closeAuthModalBtn">&times;</button>
            </div>
            <div class="modal-body">
                <form id="authForm">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" id="authUsernameInput" class="form-input" placeholder="Enter username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" id="authPasswordInput" class="form-input" placeholder="Enter password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mt-2">Sign In / Register</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Application ES Modules -->
    <script type="module" src="app.js"></script>
</body>
</html>
