name: Daily NEPSE Stock Scraping

on:
  schedule:
    # Run every day at 15:30 NST (09:45 UTC)
    - cron: '45 9 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write # Required to push committed data back to the repo

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run NEPSE Scraper
      run: python3 scrape.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Check if files changed
        git add data/nepse_today.json data/nepse_today.csv
        
        if git diff --cached --quiet; then
          echo "No new stock data updates detected."
        else
          git commit -m "auto(data): update today NEPSE stock price data sheet"
          git push
          echo "Successfully updated stock data files on main branch!"
        fi
