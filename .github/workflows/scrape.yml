name: Daily NEPSE Stock Scraping

on:
  schedule:
    # Live Trading Hours: Every 5 minutes from 11:00 AM to 3:15 PM NST (Sun-Thu)
    # (11:00 AM NST = 05:15 UTC, 03:15 PM NST = 09:30 UTC)
    - cron: '15,20,25,30,35,40,45,50,55 5 * * 0-4'
    - cron: '*/5 6-8 * * 0-4'
    - cron: '0,5,10,15,20,25,30 9 * * 0-4'
    # Post-market final archive run: 04:15 PM NST (10:30 UTC)
    - cron: '30 10 * * 0-4'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write # Required to push committed data back to the repo

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install requests || true

    - name: Run NEPSE Price Scraper
      env:
        NPSTOCKS_USERNAME: ${{ secrets.NPSTOCKS_USERNAME }}
        NPSTOCKS_PASSWORD: ${{ secrets.NPSTOCKS_PASSWORD }}
      run: python3 scrape.py

    - name: Run Fundamentals Scraper
      run: |
        python3 -c "
import sys
sys.path.insert(0, '.')
from scrape import scrape_live_official_fundamentals
scrape_live_official_fundamentals()
print('Fundamentals scrape complete.')
"
      continue-on-error: true

    - name: Run Share Structure Scraper
      run: |
        python3 -c "
import sys
sys.path.insert(0, '.')
from scrape import scrape_live_official_share_structure_and_lockin
scrape_live_official_share_structure_and_lockin()
print('Share structure scrape complete.')
"
      continue-on-error: true

    - name: Run Corporate Calendar Scraper
      run: |
        python3 -c "
import sys
sys.path.insert(0, '.')
from scrape import scrape_live_official_corporate_calendar
scrape_live_official_corporate_calendar()
print('Corporate calendar scrape complete.')
"
      continue-on-error: true

    - name: Sync to Supabase
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: python3 sync_to_supabase.py
      continue-on-error: true

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        # Stage all updated data files
        git add data/nepse_today.json \
                data/nepse_today.csv \
                data/nepse_fundamentals_live.json \
                data/nepse_share_structure_live.json \
                data/nepse_corporate_live.json || true

        if git diff --cached --quiet; then
          echo "No new stock data updates detected."
        else
          git commit -m "auto(data): update NEPSE stock data, fundamentals & corporate calendar [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
          echo "Successfully updated all stock data files on main branch!"
        fi
